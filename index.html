<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-hover:#F7F6F3;
    --bg-app:#FBFAF8;
    --border:#E9E7E1;
    --border-strong:#DAD7CE;
    --text:#37352F;
    --text-secondary:#8F8C82;
    --text-faint:#B8B5AB;
    --accent:#2F7A4D;
    --accent-dark:#1F5636;
    --accent-light:#E7F2EC;
    --danger:#C0392B;
    --danger-light:#FBEAE8;
    --radius:6px;
    --shadow-pop: 0 4px 16px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-app);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:40px 32px 80px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:28px;
    gap:20px;
    flex-wrap:wrap;
  }
  .roster-switcher{
    position:relative;
    margin-bottom:4px;
  }
  .roster-switcher-btn{
    font-family:'Inter Tight',sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    padding:2px 4px;
    margin:0 0 -2px -4px;
    color:var(--text);
    cursor:pointer;
    border-radius:6px;
  }
  .roster-switcher-btn:hover{ background:var(--bg-hover); }
  .roster-switcher-btn:hover .roster-chevron{ color:var(--text-secondary); }
  .roster-chevron{
    width:16px;
    height:16px;
    color:var(--text-faint);
    margin-top:3px;
  }
  .title-block .pitch-dot{
    width:10px;height:10px;border-radius:2px;
    background:var(--accent);
    display:inline-block;
    transform:rotate(45deg);
    flex:0 0 auto;
  }
  .title-block p{
    margin:0;
    font-size:13px;
    color:var(--text-secondary);
  }
  .roster-menu{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    min-width:230px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow-pop);
    padding:6px;
    z-index:150;
  }
  .roster-menu-list{
    max-height:260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .roster-menu-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:8px 9px;
    border-radius:6px;
    font-size:13.5px;
    color:var(--text);
    cursor:pointer;
  }
  .roster-menu-item:hover{ background:var(--bg-hover); }
  .roster-menu-item.active{ color:var(--accent-dark); font-weight:600; }
  .roster-menu-item .val{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .roster-menu-check{
    width:14px;
    height:14px;
    flex:0 0 auto;
    color:var(--accent);
  }
  .roster-menu-spacer{ width:14px; flex:0 0 auto; }
  .roster-menu-divider{
    height:1px;
    background:var(--border);
    margin:6px 2px;
  }
  .roster-menu-action{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:8px 9px;
    border-radius:6px;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    cursor:pointer;
  }
  .roster-menu-action:hover{ background:var(--bg-hover); color:var(--text); }
  .roster-menu-action.roster-menu-danger{ color:var(--danger); }
  .roster-menu-action.roster-menu-danger:hover{ background:var(--danger-light); }
  .roster-menu-action:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .roster-menu-action:disabled:hover{ background:none; color:var(--text-secondary); }

  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  select, button, input[type=file], input[type=search]{
    font-family:inherit;
    font-size:13px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
    font-weight:500;
    transition:background 0.12s, border-color 0.12s;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--bg-hover); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
  .btn-ghost{
    border-color:transparent;
    background:transparent;
    color:var(--text-secondary);
  }
  .btn-ghost:hover{ background:var(--bg-hover); color:var(--text); }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  select{
    padding:7px 28px 7px 10px;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:var(--bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%238F8C82" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 10px center;
    appearance:none;
    -webkit-appearance:none;
    color:var(--text);
    cursor:pointer;
  }
  .search-box{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:0 8px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    background:var(--bg);
    height:32px;
  }
  .search-box svg{
    width:14px;
    height:14px;
    color:var(--text-secondary);
    flex:0 0 auto;
  }
  .search-box input{
    width:150px;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    padding:0;
  }
  .search-box input::placeholder{ color:var(--text-faint); }
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-faint);
    font-weight:600;
    margin-right:2px;
  }
  #import-input, #club-emblem-input{ display:none; }

  /* ---------- Table shell ---------- */
  .table-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  colgroup col.c-name{ width:17%; }
  colgroup col.c-nat{ width:13%; }
  colgroup col.c-club{ width:15%; }
  colgroup col.c-pos{ width:11%; }
  colgroup col.c-bday{ width:13%; }
  colgroup col.c-height{ width:10%; }
  colgroup col.c-score{ width:15%; }
  colgroup col.c-actions{ width:6%; }

  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
    color:var(--text-secondary);
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    user-select:none;
  }
  thead th.sortable{ cursor:pointer; }
  thead th.sortable:hover{ color:var(--text); }
  thead th .sort-arrow{
    display:inline-block;
    margin-left:4px;
    font-size:10px;
    color:var(--text-faint);
  }
  thead th.active-sort .sort-arrow{ color:var(--accent); }

  tbody tr.player-row{
    border-bottom:1px solid var(--border);
    transition:background 0.1s;
  }
  tbody tr.player-row:hover{ background:var(--bg-hover); }
  tbody tr.player-row:last-child{ border-bottom:none; }

  td{
    padding:0;
    font-size:13.5px;
    vertical-align:middle;
    height:42px;
  }
  .cell{
    display:flex;
    align-items:center;
    height:100%;
    padding:0 14px;
    cursor:text;
    min-width:0;
  }
  .cell span.val{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cell.empty span.val{ color:var(--text-faint); font-style:italic; }
  .cell input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    padding:0;
    height:100%;
  }
  .cell input:focus{ outline:none; }
  .cell select{
    width:100%;
    min-width:0;
    border:none;
    outline:none;
    background-color:transparent;
    padding-left:0;
  }
  .name-cell .val{ font-weight:500; }
  .country-flag.fi{
    width:22px;
    height:15px;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.08);
    background-size:cover;
  }
  .club-display{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    width:100%;
  }
  .club-emblem{
    width:22px;
    height:22px;
    border-radius:4px;
    object-fit:cover;
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--bg-hover);
  }
  .club-upload-btn{
    opacity:0;
    margin-left:auto;
    flex:0 0 auto;
    border:none;
    background:transparent;
    color:var(--text-faint);
    border-radius:4px;
    padding:4px;
    cursor:pointer;
    display:flex;
  }
  .cell:hover .club-upload-btn{ opacity:1; }
  .club-upload-btn:hover{
    color:var(--accent);
    background:var(--accent-light);
  }
  .club-upload-btn svg{ width:14px; height:14px; }

  /* position tag */
  .tag{
    display:inline-flex;
    align-items:center;
    padding:2px 8px;
    border-radius:4px;
    font-size:12px;
    font-weight:500;
    line-height:1.5;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* score bar */
  .score-cell{ padding:0 14px; }
  .score-wrap{
    position:relative;
    height:24px;
    width:100%;
    background:var(--bg-hover);
    border-radius:4px;
    overflow:hidden;
    cursor:text;
  }
  .score-bar{
    position:absolute;
    top:0; left:0; bottom:0;
    background:var(--accent-light);
    border-right:2px solid var(--accent);
    transition:width 0.25s ease;
  }
  .score-num{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 8px;
    min-width:42px;
    width:42px;
    margin-left:auto;
    background:linear-gradient(90deg, rgba(255,255,255,0), var(--bg-hover) 38%);
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:12.5px;
    color:var(--accent-dark);
  }
  .score-wrap input{
    position:relative;
    z-index:2;
    height:100%;
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    padding:0 8px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--accent-dark);
    font-family:inherit;
    font-size:12.5px;
  }

  /* delete action */
  .row-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
  }
  .del-btn{
    opacity:0;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text-faint);
    padding:6px;
    border-radius:4px;
    display:flex;
    transition:opacity 0.1s, color 0.1s, background 0.1s;
  }
  tr.player-row:hover .del-btn{ opacity:1; }
  .del-btn:hover{ color:var(--danger); background:var(--danger-light); }
  .del-btn svg{ width:15px; height:15px; }

  /* add row */
  .add-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    color:var(--text-secondary);
    font-size:13.5px;
    cursor:pointer;
    border-top:1px solid var(--border);
    transition:background 0.1s, color 0.1s;
  }
  .add-row:hover{ background:var(--bg-hover); color:var(--text); }
  .add-row svg{ width:15px; height:15px; }

  /* group headers */
  tr.group-row td{
    padding:0;
    height:auto;
  }
  .group-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 14px 8px;
    cursor:pointer;
    user-select:none;
  }
  .group-header .chev{
    width:14px;height:14px;
    color:var(--text-faint);
    transition:transform 0.15s;
    flex-shrink:0;
  }
  .group-header.collapsed .chev{ transform:rotate(-90deg); }
  .group-header .gname{
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .group-header .gcount{
    font-size:12px;
    color:var(--text-faint);
    font-weight:500;
  }
  tr.group-row:first-child .group-header{ padding-top:10px; }

  /* empty state */
  .empty-state{
    text-align:center;
    padding:64px 20px;
  }
  .empty-state h3{
    font-size:15px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--text);
  }
  .empty-state p{
    font-size:13px;
    color:var(--text-secondary);
    margin:0 0 18px;
  }

  .hint-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    font-size:12px;
    color:var(--text-faint);
    padding:0 2px;
  }
  .warning-bar{
    display:none;
    align-items:flex-start;
    gap:8px;
    margin:0 0 12px;
    padding:10px 12px;
    border:1px solid #F1D19B;
    background:#FFF7E8;
    color:#6B4300;
    border-radius:var(--radius);
    font-size:13px;
  }
  .warning-bar svg{
    width:15px;
    height:15px;
    flex:0 0 auto;
    margin-top:1px;
  }

  /* group header score summary */
  .gtotal{
    font-size:12px;
    color:var(--accent-dark);
    font-weight:600;
    margin-left:2px;
    padding:2px 8px;
    background:var(--accent-light);
    border-radius:4px;
  }

  /* ---------- Rankings modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(55,53,47,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .modal-panel{
    background:var(--bg);
    border-radius:12px;
    box-shadow:var(--shadow-pop);
    width:100%;
    max-width:640px;
    max-height:min(680px, 88vh);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 12px;
    flex:0 0 auto;
  }
  .modal-header h2{
    margin:0;
    font-family:'Inter Tight',sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .modal-close{
    border:none;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    padding:6px;
    border-radius:6px;
    display:flex;
  }
  .modal-close:hover{ background:var(--bg-hover); color:var(--text); }
  .modal-close svg{ width:16px; height:16px; }
  .modal-tabs{
    display:flex;
    gap:4px;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .modal-tab{
    border:none;
    background:transparent;
    padding:9px 4px;
    margin-bottom:-1px;
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .modal-tab + .modal-tab{ margin-left:14px; }
  .modal-tab:hover{ color:var(--text); }
  .modal-tab.active{ color:var(--accent-dark); border-bottom-color:var(--accent); }
  .modal-asof{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 20px 0;
    flex:0 0 auto;
  }
  .modal-asof input[type=date]{
    font-family:inherit;
    font-size:13px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
  }
  .btn-small{
    padding:5px 10px;
    font-size:12px;
  }
  .rankings-asof-note{
    font-size:12px;
    color:var(--text-faint);
    font-style:italic;
  }
  .modal-body{
    overflow-y:auto;
    padding:8px 20px 20px;
    flex:1 1 auto;
  }
  table.rank-table{
    width:100%;
    border-collapse:collapse;
  }
  table.rank-table thead th{
    position:sticky;
    top:0;
    background:var(--bg);
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
    color:var(--text-secondary);
    padding:8px 8px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  table.rank-table thead th:hover{ color:var(--text); }
  table.rank-table thead th.active-sort{ color:var(--accent-dark); }
  table.rank-table thead th .sort-arrow{
    display:inline-block;
    margin-left:3px;
    font-size:9px;
    color:var(--text-faint);
  }
  table.rank-table thead th.active-sort .sort-arrow{ color:var(--accent); }
  table.rank-table td{
    padding:9px 8px;
    font-size:13px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  table.rank-table tbody tr:last-child td{ border-bottom:none; }
  table.rank-table tbody tr:hover{ background:var(--bg-hover); }
  .rank-num{
    font-variant-numeric:tabular-nums;
    color:var(--text-faint);
    font-weight:600;
    width:28px;
  }
  .rank-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:500;
    min-width:0;
  }
  .rank-name span.val{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .rank-total, .rank-avg, .rank-count{
    font-variant-numeric:tabular-nums;
    text-align:right;
    white-space:nowrap;
  }
  .rank-total{ font-weight:600; color:var(--accent-dark); }
  .rank-empty{
    text-align:center;
    padding:36px 12px;
    color:var(--text-secondary);
    font-size:13px;
  }

  /* ---------- Storage warning banner ---------- */
  .storage-warning{
    position:sticky;
    top:0;
    z-index:300;
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:#FBEAE8;
    color:#791F1F;
    border-bottom:1px solid #E3B3AC;
    padding:10px 20px;
    font-size:13px;
    line-height:1.5;
  }
  .storage-warning svg{
    width:17px;
    height:17px;
    flex:0 0 auto;
    margin-top:2px;
  }
  .storage-warning.storage-warning-mild{
    background:#FCF3D9;
    color:#6B4E00;
    border-bottom-color:#E9D48C;
  }
  .storage-warning-detail{
    margin-top:3px;
    font-size:11.5px;
    opacity:0.75;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (max-width: 900px){
    .wrap{ padding:24px 16px 60px; }
    colgroup col.c-nat, colgroup col.c-bday{ width:0; display:none; }
    thead th:nth-child(2), thead th:nth-child(5),
    tbody td:nth-child(2), tbody td:nth-child(5){ display:none; }
  }
</style>
</head>
<body>

<div id="storage-warning" class="storage-warning" style="display:none;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <div>
    <div id="storage-warning-text"></div>
    <div id="storage-warning-detail" class="storage-warning-detail"></div>
  </div>
</div>

<div class="wrap">

    if (idbPromise) return idbPromise;

      if (!window.indexedDB){ reject(new Error('IndexedDB is not available in this browser.')); return; }
      var req;
      try {
        req = indexedDB.open(DB_NAME, 1);
      } catch (err){ reject(err); return; }
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject((e.target && e.target.error) || new Error('Could not open IndexedDB.')); };
      req.onblocked = function(){ reject(new Error('IndexedDB open was blocked.')); };
    });
    return idbPromise;
  }

  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, 'readonly');
        var store = tx.objectStore(DB_STORE);
        var req = store.get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error || new Error('IndexedDB read failed.')); };
      });
    });
  }

  function idbSet(key, value){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, 'readwrite');
        var store = tx.objectStore(DB_STORE);
        var req = store.put(value, key);
        req.onsuccess = function(){ resolve(); };
        req.onerror = function(){ reject(req.error || new Error('IndexedDB write failed.')); };
      });
    });
  }

  function probeStorage(store){
    var testKey = '__rm_probe__';
    store.setItem(testKey, '1');
    store.removeItem(testKey);
  }

  function readSyncFallbackKey(key){
    try {
      probeStorage(window.localStorage);
      storageMode = 'local';
      return localStorage.getItem(key);
    } catch (e){ /* keep trying */ }
    try {
      probeStorage(window.sessionStorage);
      storageMode = 'session';
      return sessionStorage.getItem(key);
    } catch (e2){ /* keep trying */ }
    storageMode = 'memory';
    return memoryStore[key] || null;
  }

  function readKeyChain(key){
    return idbGet(key).then(function(value){
      storageMode = 'indexeddb';
      return value || null;
    }).catch(function(err){
      console.warn('IndexedDB unavailable, falling back to browser storage:', err);
      storageErrorDetail = describeErr(err);
      return readSyncFallbackKey(key);
    }).then(function(value){
      setStorageWarning(storageMode);
      return value;
    });

  function writeKeyChain(key, payload){
    return idbSet(key, payload).then(function(){
      storageMode = 'indexeddb';
      setStorageWarning('indexeddb');
      return true;
    }).catch(function(err){
      console.warn('IndexedDB save failed, falling back:', err);
      storageErrorDetail = describeErr(err);
      try {
        localStorage.setItem(key, payload);
        storageMode = 'local';
        setStorageWarning('local');
        return true;
      } catch (err2){
        console.warn('localStorage save failed, falling back to sessionStorage:', err2);
        storageErrorDetail = describeErr(err2);
        try {
          sessionStorage.setItem(key, payload);
          storageMode = 'session';
          setStorageWarning('session');
          return true;
        } catch (err3){
          console.warn('sessionStorage save failed, falling back to memory:', err3);
          storageErrorDetail = describeErr(err3);
          memoryStore[key] = payload;
          storageMode = 'memory';
          setStorageWarning('memory');
          return false;
        }
      }
    });
  }

  function deleteKeyChain(key){
    var idbDone = idbOpen().then(function(db){
      return new Promise(function(resolve){
        try {
          var tx = db.transaction(DB_STORE, 'readwrite');
          var req = tx.objectStore(DB_STORE).delete(key);
          req.onsuccess = function(){ resolve(); };
          req.onerror = function(){ resolve(); };
        } catch (e){ resolve(); }
      });
    }).catch(function(){});
    try { localStorage.removeItem(key); } catch (e){}
    try { sessionStorage.removeItem(key); } catch (e){}

    return idbDone;

      'Iran': 'IR Iran',
      'Laos': 'Laos',
      'North Korea': 'DPR Korea',
      'Republic of Korea': 'Korea Republic',
      'Russia': 'Russia',
      'Sao Tome and Principe': 'Sao Tome and Principe',
      'São Tomé and Príncipe': 'Sao Tome and Principe',
      'Turkey': 'Turkiye',
      'Türkiye': 'Turkiye',
      'United States': 'USA',
      'United States of America': 'USA'
    };
    return aliases[name] || name || '';
  }

  function normalizePlayer(raw){
    return {
      id: raw.id || uid(),
      name: raw.name || 'Untitled Player',
      nationality: normalizeAssociationName(raw.nationality || ''),
      club: raw.club || '',
      position: raw.position || '',
      birthday: raw.birthday || '',
      height: raw.height === '' || raw.height == null ? '' : Number(raw.height),
      score: normalizeScore(raw.score)
    };
  }

  function rosterDataKey(id){ return 'roster-management.roster-data.v1.' + id; }
  function newRosterId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function parsePayload(stored){
    if (!stored) return null;
    try {
      var parsed = JSON.parse(stored);
      var incoming = Array.isArray(parsed) ? parsed : parsed.players;
      clubLogos = (parsed && !Array.isArray(parsed) && parsed.clubLogos && typeof parsed.clubLogos === 'object') ? parsed.clubLogos : {};
      scoreHistory = (parsed && !Array.isArray(parsed) && parsed.scoreHistory && typeof parsed.scoreHistory === 'object') ? parsed.scoreHistory : {};
      if (!Array.isArray(incoming)) return null;
      var loaded = incoming.map(normalizePlayer);
      // migrate any legacy per-player clubLogo values into the club-keyed store
      incoming.forEach(function(raw){
        var key = (raw.club || '').trim();
        if (key && raw.clubLogo && !clubLogos[key]) clubLogos[key] = raw.clubLogo;
      });
      // backfill history for any player that predates history tracking
      loaded.forEach(function(p){
        if (!scoreHistory[p.id] || !scoreHistory[p.id].length) recordHistory(p);
      });
      return loaded;
    } catch (err){
      return null;
    }
  }

  function loadRosterData(id){
    return readKeyChain(rosterDataKey(id)).then(function(stored){
      var loaded = parsePayload(stored);
      if (loaded) return loaded;
      // shouldn't normally happen (rosters are given initial data when created), but recover gracefully
      clubLogos = {};
      scoreHistory = {};
      var seeded = samplePlayers().map(normalizePlayer);
      seeded.forEach(function(p){ recordHistory(p); });
      savePlayers(seeded);
      return seeded;
    });
  }

  function savePlayers(list){
    var payload;
    try {
      payload = JSON.stringify({players: list || players, clubLogos: clubLogos, scoreHistory: scoreHistory});
    } catch (err){
      console.warn('Could not prepare roster data for saving:', err);
      storageMode = 'memory';
      storageErrorDetail = describeErr(err) || 'Could not serialize roster data.';
      setStorageWarning(storageMode);
      return Promise.resolve(false);
    }
    return writeKeyChain(rosterDataKey(currentRosterId), payload);
  }

  function saveMeta(){
    var payload;
    try {
      payload = JSON.stringify({rosters: rosters, currentRosterId: currentRosterId});
    } catch (err){
      return Promise.resolve(false);
    }
    return writeKeyChain(META_KEY, payload);
  }

  function migrateOrCreateDefaultRoster(){
    return idbGet(STORAGE_KEY).catch(function(){ return null; }).then(function(oldValue){
      if (!oldValue){ try { oldValue = localStorage.getItem(STORAGE_KEY); } catch (e){} }
      if (!oldValue){ try { oldValue = sessionStorage.getItem(STORAGE_KEY); } catch (e){} }
      var id = 'default';
      rosters = [{id: id, name: 'My Roster', createdAt: Date.now()}];
      currentRosterId = id;
      if (oldValue){
        // an earlier, pre-multi-roster version of this app already has data — adopt it as-is
        return writeKeyChain(rosterDataKey(id), oldValue).then(function(){ return saveMeta(); });
      }
      // brand new install: seed the very first roster with sample players
      clubLogos = {};
      scoreHistory = {};
      var seeded = samplePlayers().map(normalizePlayer);
      seeded.forEach(function(p){ recordHistory(p); });
      var payload = JSON.stringify({players: seeded, clubLogos: clubLogos, scoreHistory: scoreHistory});
      return writeKeyChain(rosterDataKey(id), payload).then(function(){ return saveMeta(); });
    });
  }

  function loadMetaAndMigrate(){
    return readKeyChain(META_KEY).then(function(stored){
      if (stored){
        try {
          var parsed = JSON.parse(stored);
          if (parsed && Array.isArray(parsed.rosters) && parsed.rosters.length){
            rosters = parsed.rosters;
            currentRosterId = (parsed.currentRosterId && rosters.some(function(r){ return r.id === parsed.currentRosterId; }))
              ? parsed.currentRosterId : rosters[0].id;
            return;
          }
        } catch (e){}
      }
      return migrateOrCreateDefaultRoster();
    });
  }

  /* ---------------- helpers ---------------- */
  function esc(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function fmtDate(iso){
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    var d = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric', timeZone:'UTC'});
  }

  function maxScore(){
    var m = 0;
    players.forEach(function(p){ var s = normalizeScore(p.score); if (s > m) m = s; });
    return m || 1;
  }

  function uniqueValues(field){
    var seen = {};
    var out = [];
    players.forEach(function(p){
      var v = (p[field] || '').trim();
      if (v && !seen[v]){ seen[v] = true; out.push(v); }
    });
    out.sort(function(a,b){ return a.localeCompare(b); });
    return out;
  }

  function visiblePlayers(){
    var q = state.searchQuery.trim().toLowerCase();
    if (!q) return players.slice();
    return players.filter(function(p){
      return (p.name || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  function duplicatePlayerNames(){
    var counts = {};
    var display = {};
    players.forEach(function(p){
      var name = (p.name || '').trim();
      if (!name || name === 'Untitled Player') return;
      var key = name.toLowerCase();
      counts[key] = (counts[key] || 0) + 1;
      display[key] = name;
    });
    return Object.keys(counts).filter(function(key){
      return counts[key] > 1;
    }).map(function(key){ return display[key]; }).sort(function(a,b){ return a.localeCompare(b); });
  }

  function updateDuplicateWarning(){
    var warning = document.getElementById('duplicate-warning');
    var text = document.getElementById('duplicate-warning-text');
    if (!warning || !text) return;
    var duplicates = duplicatePlayerNames();
    if (duplicates.length === 0){
      warning.style.display = 'none';
      text.textContent = '';
      return;
    }
    warning.style.display = 'flex';
    text.textContent = 'Possible duplicate player' + (duplicates.length === 1 ? '' : 's') + ': ' + duplicates.join(', ');
  }

  /* ---------------- rendering ---------------- */
  var collapsedGroups = {};

  function render(){
    var card = document.getElementById('table-card');
    var subtitle = document.getElementById('subtitle');
    var hintBar = document.getElementById('hint-bar');
    var footerNote = document.getElementById('footer-note');

    var shownPlayers = visiblePlayers();
    subtitle.textContent = players.length + (players.length === 1 ? ' player' : ' players') +
      (state.searchQuery ? (' - ' + shownPlayers.length + ' shown') : '');
    updateDuplicateWarning();

    if (players.length === 0){
      hintBar.style.display = 'none';
      card.innerHTML =

          '<h3>No players yet</h3>' +
          '<p>Add your first player to start building the roster.</p>' +
          '<button class="btn btn-primary" id="empty-add-btn">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            'Add player' +
          '</button>' +
        '</div>';
      document.getElementById('empty-add-btn').addEventListener('click', addPlayer);
      return;
    }

    hintBar.style.display = 'flex';
    footerNote.textContent = [
      state.groupBy !== 'none' ? ('Grouped by ' + (state.groupBy === 'club' ? 'club' : 'nationality')) : '',
      state.searchQuery ? ('Search: ' + state.searchQuery) : ''
    ].filter(Boolean).join(' · ');

    var html = '<table>';
    html += '<colgroup><col class="c-name"><col class="c-nat"><col class="c-club"><col class="c-pos"><col class="c-bday"><col class="c-height"><col class="c-score"><col class="c-actions"></colgroup>';
    html += '<thead><tr>';
    html += '<th>Name</th><th>Nationality</th><th>Club</th><th>Position</th><th>Birthday</th><th>Height</th>';
    html += '<th class="sortable active-sort" id="score-header">Score<span class="sort-arrow">' + (state.sortDir === 'desc' ? '\u2193' : '\u2191') + '</span></th>';
    html += '<th></th>';
    html += '</tr></thead><tbody>';

    var groups = buildGroups();
    if (shownPlayers.length === 0){
      html += '<tr><td colspan="8"><div class="empty-state">' +
        '<h3>No matching players</h3>' +
        '<p>Try a different player name.</p>' +
      '</div></td></tr>';
    }

    groups.forEach(function(g){
      if (g.key !== null){
        var collapsed = !!collapsedGroups[g.key];
        html += '<tr class="group-row"><td colspan="8">' +
          '<div class="group-header' + (collapsed ? ' collapsed' : '') + '" data-group="' + esc(g.key) + '">' +
            '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
            '<span class="gname">' + esc(g.key) + '</span>' +
            '<span class="gcount">' + g.items.length + (g.items.length === 1 ? ' player' : ' players') + '</span>' +
            '<span class="gtotal">&Sigma; ' + g.total + '</span>' +
          '</div>' +
        '</td></tr>';
        if (collapsed) return;
      }
      g.items.forEach(function(p){ html += renderRow(p); });
    });

    html += '</tbody></table>';
    html += '<div class="add-row" id="add-row-trigger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New player</div>';

    card.innerHTML = html;
    attachRowHandlers();

    document.getElementById('score-header').addEventListener('click', function(){
      state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
      render();
    });
    document.getElementById('add-row-trigger').addEventListener('click', addPlayer);

    Array.prototype.forEach.call(document.querySelectorAll('.group-header'), function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-group');
        collapsedGroups[key] = !collapsedGroups[key];
        render();
      });
    });
  }

  function buildGroups(){
    var field = state.groupBy;
    var basePlayers = visiblePlayers();

    function sortFn(a, b){
      var sa = normalizeScore(a.score), sb = normalizeScore(b.score);
      return state.sortDir === 'desc' ? sb - sa : sa - sb;
    }

    if (field === 'none'){
      var items = basePlayers.slice().sort(sortFn);
      return [{key: null, items: items}];
    }

    var buckets = {};
    var order = [];
    basePlayers.forEach(function(p){
      var v = (p[field] || '').trim() || 'Unspecified';
      if (state.filterValue !== 'all' && v !== state.filterValue) return;
      if (!buckets[v]){ buckets[v] = []; order.push(v); }
      buckets[v].push(p);
    });
    order.sort(function(a,b){ return a.localeCompare(b); });
    return order.map(function(key){
      var items = buckets[key].sort(sortFn);
      var total = items.reduce(function(sum, p){ return sum + normalizeScore(p.score); }, 0);
      return {key: key, items: items, total: total};
    });
  }

  /* ---------------- rankings modal ---------------- */
  function todayStr(){
    var d = new Date();
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    if (m.length < 2) m = '0' + m;
    if (day.length < 2) day = '0' + day;
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function isLiveMode(){
    return !rankingsState.dateStr || rankingsState.dateStr >= todayStr();
  }

  function rankingsSourceRows(){
    if (isLiveMode()){
      return players.map(function(p){
        return {
          name: p.name || 'Untitled Player',
          club: (p.club || '').trim() || 'Unspecified',
          nationality: (p.nationality || '').trim() || 'Unspecified',
          score: normalizeScore(p.score)
        };
      });
    }
    var refMs = new Date(rankingsState.dateStr + 'T23:59:59.999').getTime();
    return rosterAsOf(refMs).map(function(p){
      return {
        name: p.name || 'Untitled Player',
        club: p.club || 'Unspecified',
        nationality: p.nationality || 'Unspecified',
        score: p.score
      };
    });
  }

  function computeRankings(field){
    var rows = rankingsSourceRows();
    var buckets = {};
    var order = [];
    rows.forEach(function(p){
      var v = p[field] || 'Unspecified';
      if (!buckets[v]){ buckets[v] = []; order.push(v); }
      buckets[v].push(p);
    });
    var out = order.map(function(key){
      var items = buckets[key];
      var total = items.reduce(function(sum, p){ return sum + p.score; }, 0);
      var count = items.length;
      var avg = count ? total / count : 0;
      return {name: key, count: count, total: total, avg: avg};
    });
    out.sort(function(a, b){
      var av = typeof a[rankingsState.sortField] === 'number' ? a[rankingsState.sortField] : a.total;
      var bv = typeof b[rankingsState.sortField] === 'number' ? b[rankingsState.sortField] : b.total;
      var diff = rankingsState.sortDir === 'desc' ? bv - av : av - bv;
      if (diff !== 0) return diff;
      return a.name.localeCompare(b.name);
    });
    return out;
  }

  function computePlayerRankings(){
    var rows = rankingsSourceRows();
    var sortByName = rankingsState.sortField === 'name';
    rows.sort(function(a, b){
      if (sortByName){
        var d = a.name.localeCompare(b.name);
        return rankingsState.sortDir === 'desc' ? -d : d;
      }
      var diff = rankingsState.sortDir === 'desc' ? b.score - a.score : a.score - b.score;
      if (diff !== 0) return diff;
      return a.name.localeCompare(b.name);
    });
    return rows;
  }

  function renderRankings(){
    var body = document.getElementById('rankings-body');
    var tab = rankingsState.tab;

    document.getElementById('rankings-tab-player').classList.toggle('active', tab === 'player');
    document.getElementById('rankings-tab-club').classList.toggle('active', tab === 'club');
    document.getElementById('rankings-tab-nationality').classList.toggle('active', tab === 'nationality');

    var note = document.getElementById('rankings-asof-note');
    note.textContent = isLiveMode() ? '' : ('Showing rankings as of ' + fmtDate(rankingsState.dateStr) + '.');

    function arrow(f){
      if (rankingsState.sortField !== f) return '';
      return '<span class="sort-arrow">' + (rankingsState.sortDir === 'desc' ? '\u2193' : '\u2191') + '</span>';
    }
    function sortClass(f){ return rankingsState.sortField === f ? ' active-sort' : ''; }

    var html;

    if (tab === 'player'){
      var prows = computePlayerRankings();
      if (prows.length === 0){
        body.innerHTML = '<div class="rank-empty">' + (isLiveMode() ? 'No players yet.' : 'No history recorded as of this date yet.') + '</div>';
        return;

      html = '<table class="rank-table"><thead><tr>';
      html += '<th class="rank-num">#</th>';

      html += '<th>Nationality</th>';
      html += '<th class="sortable' + sortClass('score') + '" data-sort="score" style="text-align:right;">Score' + arrow('score') + '</th>';
      html += '</tr></thead><tbody>';
      prows.forEach(function(row, i){
        html += '<tr>';
        html += '<td class="rank-num">' + (i + 1) + '</td>';
        html += '<td><div class="rank-name"><span class="val">' + esc(row.name) + '</span></div></td>';
        var pClubLogo = row.club && row.club !== 'Unspecified' ? (clubLogos[row.club] || '') : '';
        html += '<td><div class="rank-name">' + (pClubLogo ? '<img class="club-emblem" src="' + esc(pClubLogo) + '" alt="">' : '') + '<span class="val">' + esc(row.club) + '</span></div></td>';
        html += '<td><div class="rank-name">' + countryFlag(row.nationality) + '<span class="val">' + esc(row.nationality) + '</span></div></td>';
        html += '<td class="rank-total">' + row.score + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    } else {
      var rows = computeRankings(tab);
      if (rows.length === 0){
        body.innerHTML = '<div class="rank-empty">' + (isLiveMode() ? 'No players yet.' : 'No history recorded as of this date yet.') + '</div>';
        return;
      }
      html = '<table class="rank-table"><thead><tr>';
      html += '<th class="rank-num">#</th>';
      html += '<th>' + (tab === 'club' ? 'Club' : 'Nationality') + '</th>';
      html += '<th class="sortable' + sortClass('count') + '" data-sort="count" style="text-align:right;">Players' + arrow('count') + '</th>';
      html += '<th class="sortable' + sortClass('total') + '" data-sort="total" style="text-align:right;">Total' + arrow('total') + '</th>';
      html += '<th class="sortable' + sortClass('avg') + '" data-sort="avg" style="text-align:right;">Average' + arrow('avg') + '</th>';
      html += '</tr></thead><tbody>';
      rows.forEach(function(row, i){
        var flag = tab === 'nationality' ? countryFlag(row.name) : '';
        var clubImg = (tab === 'club' && row.name !== 'Unspecified' && clubLogos[row.name])
          ? '<img class="club-emblem" src="' + esc(clubLogos[row.name]) + '" alt="">' : '';
        html += '<tr>';
        html += '<td class="rank-num">' + (i + 1) + '</td>';
        html += '<td><div class="rank-name">' + flag + clubImg + '<span class="val">' + esc(row.name) + '</span></div></td>';
        html += '<td class="rank-count">' + row.count + '</td>';
        html += '<td class="rank-total">' + row.total + '</td>';
        html += '<td class="rank-avg">' + row.avg.toFixed(1) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }

    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll('th[data-sort]'), function(th){
      th.addEventListener('click', function(){
        var f = th.getAttribute('data-sort');
        if (rankingsState.sortField === f){
          rankingsState.sortDir = rankingsState.sortDir === 'desc' ? 'asc' : 'desc';
        } else {
          rankingsState.sortField = f;
          rankingsState.sortDir = 'desc';
        }
        renderRankings();
      });
    });
  }

  function openRankings(){

  function editableCell(p, field, extraClass, placeholder){
    var val = p[field] == null ? '' : p[field];
    var display = field === 'birthday' ? fmtDate(val) : esc(val);
    var isEmpty = val === '' || val == null;
    return '<div class="cell ' + (extraClass||'') + (isEmpty ? ' empty' : '') + '" data-id="' + p.id + '" data-field="' + field + '">' +
      '<span class="val">' + (isEmpty ? esc(placeholder || 'Empty') : display) + '</span>' +
    '</div>';
  }

  function renderRow(p){
    var max = maxScore();
    var score = normalizeScore(p.score);
    var pct = Math.max(0, Math.min(100, (score / max) * 100));
    var posColor = p.position ? hashColor(p.position) : null;
    var country = p.nationality || '';
    var flag = country ? countryFlag(country) : '';
    var club = p.club || '';
    var clubKey = club.trim();
    var clubLogo = clubKey ? (clubLogos[clubKey] || '') : '';
    var uploadDisabled = !clubKey;
    var clubCellInner = '<div class="club-display">' +
      (clubLogo ? '<img class="club-emblem" src="' + esc(clubLogo) + '" alt="">' : '') +
      '<span class="val">' + (club ? esc(club) : esc('Empty')) + '</span>' +
      '<button class="club-upload-btn" data-logo-club="' + esc(clubKey) + '"' +
        (uploadDisabled ? ' data-no-club="1"' : '') +
        ' title="' + (uploadDisabled ? 'Set a club name first' : 'Upload club emblem (applies to all players at this club)') + '" aria-label="Upload club emblem">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
      '</button>' +
    '</div>';

    var posCellInner = p.position
      ? '<span class="tag" style="background:' + posColor.bg + ';color:' + posColor.fg + ';">' + esc(p.position) + '</span>'
      : '<span class="val" style="color:var(--text-faint);font-style:italic;">Empty</span>';

    var html = '<tr class="player-row" data-row-id="' + p.id + '">';
    html += '<td class="name-cell">' + editableCell(p, 'name', 'name-cell', 'Untitled') + '</td>';
    html += '<td><div class="cell' + (country ? '' : ' empty') + '" data-id="' + p.id + '" data-field="nationality" title="' + esc(country || 'Select country') + '">' +
      (country ? flag : '<span class="val">' + esc('Empty') + '</span>') +
    '</div></td>';
    html += '<td><div class="cell' + (club ? '' : ' empty') + '" data-id="' + p.id + '" data-field="club">' + clubCellInner + '</div></td>';
    html += '<td><div class="cell" data-id="' + p.id + '" data-field="position">' + posCellInner + '</div></td>';
    html += '<td>' + editableCell(p, 'birthday', '', 'Set date') + '</td>';
    html += '<td>' + editableCell(p, 'height', '', 'Set height') + (p.height ? '' : '') + '</td>';
    html += '<td class="score-cell">' +
      '<div class="score-wrap" data-id="' + p.id + '" data-field="score">' +
        '<div class="score-bar" style="width:' + pct + '%;"></div>' +
        '<div class="score-num">' + score + '</div>' +
      '</div>' +
    '</td>';
    html += '<td><div class="row-actions"><button class="del-btn" data-del="' + p.id + '" title="Delete player" aria-label="Delete player">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
    '</button></div></td>';
    html += '</tr>';
    return html;
  }

  /* ---------------- editing ---------------- */
  function attachRowHandlers(){
    Array.prototype.forEach.call(document.querySelectorAll('.cell[data-field]'), function(cell){
      cell.addEventListener('click', function(){ beginEdit(cell); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.score-wrap'), function(cell){
      cell.addEventListener('click', function(){ beginScoreEdit(cell); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.del-btn'), function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-del');
        deletePlayer(id);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.club-upload-btn'), function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if (btn.hasAttribute('data-no-club')){
          alert('Set this player\'s club name first, then you can upload a logo for that club.');
          return;
        }
        pendingLogoClub = btn.getAttribute('data-logo-club');
        document.getElementById('club-emblem-input').click();
      });
    });
  }

  function beginEdit(cell){
    if (cell.querySelector('input, select')) return;
    var id = cell.getAttribute('data-id');
    var field = cell.getAttribute('data-field');
    var p = players.find(function(pl){ return pl.id === id; });
    if (!p) return;

    var current = p[field] == null ? '' : p[field];
    if (field === 'nationality' || field === 'position'){
      cell.innerHTML = '';
      var select = document.createElement('select');
      select.innerHTML = field === 'nationality' ? countrySelectOptions(current) : positionSelectOptions(current);
      cell.appendChild(select);
      select.focus();
      var didCommitSelect = false;

      function commitSelect(){
        if (didCommitSelect) return;
        didCommitSelect = true;
        p[field] = select.value;
        recordHistory(p);
        savePlayers();
        updateFilterOptions();
        render();
      }

      select.addEventListener('change', commitSelect);
      select.addEventListener('blur', commitSelect);
      select.addEventListener('keydown', function(e){
        if (e.key === 'Escape'){
          select.value = current;
          select.blur();
        }
      });
      return;
    }

    var inputType = 'text';
    if (field === 'birthday') inputType = 'date';
    if (field === 'height') inputType = 'number';

    cell.innerHTML = '';
    var input = document.createElement('input');
    input.type = inputType;
    input.value = current;
    if (field === 'height'){ input.min = 0; input.step = 1; input.placeholder = 'cm'; }
    if (field === 'position'){ input.placeholder = 'e.g. Forward'; }
    cell.appendChild(input);
    input.focus();
    if (inputType === 'text') input.select();

    function commit(){
      var v = input.value;
      if (field === 'height') v = v === '' ? '' : Number(v);
      p[field] = v;
      recordHistory(p);
      savePlayers();
      updateFilterOptions();
      render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ input.blur(); }
      if (e.key === 'Escape'){ input.value = current; input.blur(); }
    });
  }

  function beginScoreEdit(cell){
    if (cell.querySelector('input')) return;
    var id = cell.getAttribute('data-id');
    var p = players.find(function(pl){ return pl.id === id; });
    if (!p) return;
    var current = Number(p.score) || 0;

    var bar = cell.querySelector('.score-bar');
    var num = cell.querySelector('.score-num');
    if (bar) bar.style.display = 'none';
    if (num) num.remove();

    var input = document.createElement('input');
    input.type = 'number';
    input.value = current;
    input.min = 0;
    input.step = 1;
    cell.appendChild(input);
    input.focus();
    input.select();

    function commit(){
      p.score = normalizeScore(input.value);
      recordHistory(p);
      savePlayers();
      render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ input.blur(); }
      if (e.key === 'Escape'){ input.value = current; input.blur(); }
    });
  }

  function addPlayer(){
    var p = {
      id: uid(),
      name: 'Untitled Player',
      nationality: '',
      club: '',
      position: '',
      birthday: '',
      height: '',
      score: 0
    };
    players.push(p);
    recordHistory(p);
    savePlayers();
    updateFilterOptions();
    render();
    setTimeout(function(){
      var cell = document.querySelector('.cell[data-id="' + p.id + '"][data-field="name"]');
      if (cell) beginEdit(cell);
    }, 0);
  }

  function deletePlayer(id){
    var p = players.find(function(pl){ return pl.id === id; });
    if (!p) return;
    if (!confirm('Delete ' + (p.name || 'this player') + ' from the roster?')) return;
    players = players.filter(function(pl){ return pl.id !== id; });
    savePlayers();
    updateFilterOptions();
    render();
  }

  /* ---------------- roster switcher ---------------- */
  function currentRosterName(){
    var r = rosters.find(function(x){ return x.id === currentRosterId; });
    return r ? r.name : 'Roster';
  }

  function updateRosterTitle(){
    document.getElementById('current-roster-name').textContent = currentRosterName();
  }

  function resetViewStateForRosterSwitch(){
    collapsedGroups = {};
    state.groupBy = 'none';
    state.filterValue = 'all';
    state.searchQuery = '';
    document.getElementById('group-select').value = 'none';
    document.getElementById('filter-select').style.display = 'none';
    document.getElementById('search-input').value = '';
    document.getElementById('clear-search-btn').style.display = 'none';
    rankingsState.tab = 'player';
    rankingsState.sortField = 'score';
    rankingsState.sortDir = 'desc';
    rankingsState.dateStr = '';
  }

  function enterRoster(id){
    document.getElementById('table-card').innerHTML = '<div class="empty-state"><h3>Loading roster…</h3></div>';
    resetViewStateForRosterSwitch();
    clubLogos = {};
    scoreHistory = {};
    return loadRosterData(id).then(function(loaded){
      players = loaded;
      updateRosterTitle();
      updateFilterOptions();
      render();
    });
  }

  function switchRoster(id){
    closeRosterMenu();
    if (id === currentRosterId) return;
    savePlayers().then(function(){
      currentRosterId = id;
      saveMeta();
      enterRoster(id);
    });
  }

  function createNewRoster(){
    var name = prompt('Name for the new roster:', 'Roster ' + (rosters.length + 1));
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    closeRosterMenu();
    var id = newRosterId();
    var payload = JSON.stringify({players: [], clubLogos: {}, scoreHistory: {}});
    savePlayers().then(function(){
      return writeKeyChain(rosterDataKey(id), payload);
    }).then(function(){
      rosters.push({id: id, name: name, createdAt: Date.now()});
      currentRosterId = id;
      saveMeta();
      enterRoster(id);
    });
  }

  function renameCurrentRoster(){
    var r = rosters.find(function(x){ return x.id === currentRosterId; });
    if (!r) return;
    var name = prompt('Rename this roster:', r.name);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    r.name = name;
    saveMeta();
    updateRosterTitle();
    closeRosterMenu();
  }

  function deleteCurrentRoster(){
    if (rosters.length <= 1){
      alert('You need at least one roster — create another roster before deleting this one.');
      return;
    }
    var r = rosters.find(function(x){ return x.id === currentRosterId; });
    if (!r) return;
    if (!confirm('Delete "' + r.name + '" and all ' + players.length + ' of its players, club logos, and history? This cannot be undone.')) return;
    var deletingId = currentRosterId;
    rosters = rosters.filter(function(x){ return x.id !== deletingId; });
    var nextId = rosters[0].id;
    deleteKeyChain(rosterDataKey(deletingId));
    currentRosterId = nextId;
    saveMeta();
    closeRosterMenu();
    enterRoster(nextId);
  }

  function renderRosterMenu(){
    var menu = document.getElementById('roster-menu');
    var checkSvg = '<svg class="roster-menu-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var html = '<div class="roster-menu-list">';
    rosters.forEach(function(r){
      var active = r.id === currentRosterId;
      html += '<button class="roster-menu-item' + (active ? ' active' : '') + '" data-roster-id="' + esc(r.id) + '">' +
        (active ? checkSvg : '<span class="roster-menu-spacer"></span>') +
        '<span class="val">' + esc(r.name) + '</span>' +
      '</button>';
    });
    html += '</div><div class="roster-menu-divider"></div>';
    html += '<button class="roster-menu-action" id="roster-new-btn">+ New roster</button>';
    html += '<button class="roster-menu-action" id="roster-rename-btn">Rename this roster</button>';
    html += '<button class="roster-menu-action roster-menu-danger" id="roster-delete-btn"' + (rosters.length <= 1 ? ' disabled' : '') + '>Delete this roster</button>';
    menu.innerHTML = html;

    Array.prototype.forEach.call(menu.querySelectorAll('.roster-menu-item'), function(btn){
      btn.addEventListener('click', function(){ switchRoster(btn.getAttribute('data-roster-id')); });
    });
    document.getElementById('roster-new-btn').addEventListener('click', createNewRoster);
    document.getElementById('roster-rename-btn').addEventListener('click', renameCurrentRoster);
    document.getElementById('roster-delete-btn').addEventListener('click', deleteCurrentRoster);
  }

  function openRosterMenu(){
    rosterMenuOpen = true;
    renderRosterMenu();
    document.getElementById('roster-menu').style.display = 'block';
  }

  function closeRosterMenu(){
    rosterMenuOpen = false;
    document.getElementById('roster-menu').style.display = 'none';
  }

  function toggleRosterMenu(){
    if (rosterMenuOpen) closeRosterMenu(); else openRosterMenu();
  }

  /* ---------------- group / filter controls ---------------- */
  var groupSelect = document.getElementById('group-select');
  var filterSelect = document.getElementById('filter-select');

  groupSelect.addEventListener('change', function(){
    state.groupBy = groupSelect.value;
    state.filterValue = 'all';
    collapsedGroups = {};
    updateFilterOptions();
    render();
  });

  filterSelect.addEventListener('change', function(){
    state.filterValue = filterSelect.value;
    render();
  });

  function updateFilterOptions(){
    if (state.groupBy === 'none'){
      filterSelect.style.display = 'none';
      return;
    }
    var values = uniqueValues(state.groupBy);
    filterSelect.innerHTML = '<option value="all">All ' + (state.groupBy === 'club' ? 'clubs' : 'nationalities') + '</option>' +
      values.map(function(v){
        return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
      }).join('');
    filterSelect.style.display = 'inline-block';
  }

  /* ---------------- search controls ---------------- */
  var searchInput = document.getElementById('search-input');
  var searchBtn = document.getElementById('search-btn');
  var clearSearchBtn = document.getElementById('clear-search-btn');

  function applySearch(){
    state.searchQuery = searchInput.value.trim();
    clearSearchBtn.style.display = state.searchQuery ? 'inline-flex' : 'none';
    render();
  }

  searchBtn.addEventListener('click', applySearch);
  searchInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') applySearch();
  });
  clearSearchBtn.addEventListener('click', function(){
    searchInput.value = '';
    applySearch();
  });

  /* ---------------- import / export ---------------- */
  function exportRoster(){
    var data = JSON.stringify({ players: players, clubLogos: clubLogos, scoreHistory: scoreHistory }, null, 2);
    var blob = new Blob([data], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var stamp = new Date().toISOString().slice(0,10);
    a.download = 'roster-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  document.getElementById('export-btn').addEventListener('click', exportRoster);

  document.getElementById('import-btn').addEventListener('click', function(){
    document.getElementById('import-input').click();
  });

  document.getElementById('import-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var parsed = JSON.parse(evt.target.result);
        var incoming = Array.isArray(parsed) ? parsed : parsed.players;
        if (!Array.isArray(incoming)) throw new Error('No player list found in file.');

        var replace = players.length === 0 || confirm(
          'Import ' + incoming.length + ' player(s).\n\nOK = replace current roster\nCancel = add to current roster'
        );

        var incomingHistory = (parsed && !Array.isArray(parsed) && parsed.scoreHistory && typeof parsed.scoreHistory === 'object')
          ? parsed.scoreHistory : null;

        var cleaned = incoming.map(function(raw){
          var player = normalizePlayer(raw);
          // on a full replace we can safely keep original ids (and thus their real
          // history); on a merge, ids are regenerated to avoid colliding with the
          // roster already loaded.
          if (!replace) player.id = uid();
          return player;
        });

        var incomingLogos = (parsed && !Array.isArray(parsed) && parsed.clubLogos && typeof parsed.clubLogos === 'object')
          ? parsed.clubLogos : {};
        // migrate legacy per-player clubLogo values (older export format) into the club-keyed map
        incoming.forEach(function(raw){
          var key = (raw.club || '').trim();
          if (key && raw.clubLogo && !incomingLogos[key]) incomingLogos[key] = raw.clubLogo;
        });

        players = replace ? cleaned : players.concat(cleaned);
        clubLogos = replace ? incomingLogos : Object.assign({}, clubLogos, incomingLogos);
        if (replace){
          // a full backup (with its own history) restores that history verbatim;
          // otherwise (e.g. an older export, or a plain player list) start fresh.
          scoreHistory = incomingHistory ? incomingHistory : {};
        }
        cleaned.forEach(function(p){
          if (!scoreHistory[p.id] || !scoreHistory[p.id].length) recordHistory(p);
        });
        collapsedGroups = {};
        savePlayers();
        updateFilterOptions();
        render();
      } catch (err){
        alert('Could not import this file: ' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  });

  function resizeImageToDataURL(file, maxDim, callback){
    var reader = new FileReader();
    reader.onload = function(evt){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * scale));
        var th = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = tw;
        canvas.height = th;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, tw, th);
        ctx.drawImage(img, 0, 0, tw, th);
        var out;
        try {
          out = canvas.toDataURL('image/png');
        } catch (err){
          out = evt.target.result; // fall back to the original file if canvas export fails
        }
        callback(out);
      };
      img.onerror = function(){ callback(null); };
      img.src = evt.target.result;
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }

  document.getElementById('club-emblem-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    var club = pendingLogoClub;
    pendingLogoClub = null;
    if (!file || !club) {
      e.target.value = '';
      return;
    }
    if (!file.type || file.type.indexOf('image/') !== 0){
      alert('Please choose an image file for the club emblem.');
      e.target.value = '';
      return;
    }
    resizeImageToDataURL(file, 160, function(dataUrl){
      e.target.value = '';
      if (!dataUrl){
        alert('Could not read that image file.');
        return;
      }
      var previous = clubLogos[club];
      clubLogos[club] = dataUrl;
      savePlayers().then(function(ok){
        if (!ok){
          if (previous === undefined) delete clubLogos[club]; else clubLogos[club] = previous;
          alert('This logo could not be saved anywhere — your browser is blocking all storage for this page. Try removing a few existing club logos, use a smaller image, or check your browser\'s privacy settings.');
          return;
        }
        render();
      });
    });
  });

  document.getElementById('add-player-btn').addEventListener('click', addPlayer);

  document.getElementById('roster-switcher-btn').addEventListener('click', function(e){
    e.stopPropagation();
    toggleRosterMenu();
  });
  document.addEventListener('click', function(e){
    if (!rosterMenuOpen) return;
    var menu = document.getElementById('roster-menu');
    var btn = document.getElementById('roster-switcher-btn');
    if (!menu.contains(e.target) && !btn.contains(e.target)) closeRosterMenu();
  });

  document.getElementById('rankings-btn').addEventListener('click', openRankings);
  document.getElementById('rankings-close').addEventListener('click', closeRankings);
  document.getElementById('rankings-overlay').addEventListener('click', function(e){
    if (e.target === this) closeRankings();
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (rankingsState.open) closeRankings();
    if (rosterMenuOpen) closeRosterMenu();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.modal-tab'), function(tab){
    tab.addEventListener('click', function(){
      rankingsState.tab = tab.getAttribute('data-tab');
      rankingsState.sortField = rankingsState.tab === 'player' ? 'score' : 'total';
      rankingsState.sortDir = 'desc';
      renderRankings();
    });
  });
  document.getElementById('rankings-date').addEventListener('change', function(e){
    rankingsState.dateStr = e.target.value;
    renderRankings();
  });
  document.getElementById('rankings-date-live').addEventListener('click', function(){
    rankingsState.dateStr = '';
    document.getElementById('rankings-date').value = todayStr();
    renderRankings();
  });

  /* ---------------- init ---------------- */
  document.getElementById('table-card').innerHTML = '<div class="empty-state"><h3>Loading your roster…</h3></div>';
  loadMetaAndMigrate().then(function(){
    return loadRosterData(currentRosterId);
  }).then(function(loaded){
    players = loaded;
    updateRosterTitle();
    updateFilterOptions();
    render();
  });
})();
</script>
